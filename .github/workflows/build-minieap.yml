name: Build MiniEAP Package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      sdk_tag:
        description: "ImmortalWrt SDK 镜像标签 (例如 ramips-mt7621-24.10-SNAPSHOT)"
        required: false
        default: "ramips-mt7621-24.10-SNAPSHOT"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDK_TAG: ${{ inputs.sdk_tag || 'ramips-mt7621-24.10-SNAPSHOT' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build minieap with ImmortalWrt SDK Docker
        run: |
          mkdir -p artifacts
          chmod 777 artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/pkg:ro" \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            "immortalwrt/sdk:${SDK_TAG}" \
            bash -ce '
              [ ! -f setup.sh ] || bash setup.sh
              mkdir -p package/minieap
              cp -r /pkg/Makefile /pkg/LICENSE /pkg/files package/minieap/
              echo "CONFIG_PACKAGE_minieap=m" >> .config
              make defconfig
              make package/minieap/compile V=s
              find bin/packages -type f -name "minieap*" -exec cp -v {} /artifacts/ \;
            '
          ls -lh artifacts/
          test -n "$(ls -A artifacts/)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minieap-${{ env.SDK_TAG }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
